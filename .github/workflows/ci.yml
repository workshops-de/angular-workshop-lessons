name: CI

on:
  pull_request:
  push:
    branches: [main]

# semantic-release braucht Schreibrechte für Tags/Commit, GitHub Release und Release-PR-/Issue-Kommentare.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Nie zwei Läufe für denselben Branch parallel; laufende nicht abbrechen,
# damit ein Release-Tag nicht halbfertig bleibt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Vollständige Historie, damit alle Commits des Branches geprüft werden können.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Validate pushed commit
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

  release:
    needs: commitlint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Vollständige Historie + Tags, damit semantic-release die letzte Version findet.
          fetch-depth: 0
          # semantic-release nutzt GITHUB_TOKEN aus der Env, nicht die Checkout-Credentials.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

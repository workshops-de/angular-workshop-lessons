name: Release

on:
  push:
    branches: [main]

# semantic-release braucht Schreibrechte für Tags/Commit, GitHub Release und Release-PR-/Issue-Kommentare.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Nie zwei Release-Läufe parallel; laufende nicht abbrechen, damit ein Tag/Release nicht halbfertig bleibt.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Vollständige Historie + Tags, damit semantic-release die letzte Version findet.
          fetch-depth: 0
          # semantic-release nutzt GITHUB_TOKEN aus der Env, nicht die Checkout-Credentials.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
